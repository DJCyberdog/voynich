name: VRS baseline CPU regression
on:
  push:
    branches: [development/gpu-worker-v0.1.0, development/vrs-0.13.0, development/vrs-0.13.1, development/vrs-0.14.0, development/vrs-0.14.1, development/vrs-0.14.1-rc1]
    paths:
      - 'worker/**'
      - '.github/workflows/vrs-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: worker
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cd1455caa0de793a0b5cbffdb609098cd908482e
          path: immutable-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0+cpu
          python -m pip install Pillow==13.0.0 PyMuPDF==1.26.7 numpy==2.3.5
          python -m pip install -r requirements-hardware.txt
          python -c "import tkinter, torch, psutil; print(torch.__version__, psutil.__version__)"
      - name: Verify pinned baseline
        run: python baseline_audit.py --root ../immutable-baseline/worker
      - name: Run immutable baseline regression (private fixtures intentionally absent)
        working-directory: immutable-baseline/worker
        run: xvfb-run -a python -m unittest discover -v
      - name: Run current regression tests (private fixtures intentionally absent)
        run: xvfb-run -a python -m unittest discover -v
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/heads/development/vrs-0.14.')
        with:
          ref: 74eeab963a6451b63496ed8e29f7c0518b939980
          path: immutable-rc-base
          persist-credentials: false
      - name: Immutable 0.13.x source upgrade, rollback and replay
        if: startsWith(github.ref, 'refs/heads/development/vrs-0.14.')
        run: python -B vrs_rc_cross_version.py --old-source ../immutable-rc-base/worker
      - name: Capture actual synthetic GUI gallery (dark and light)
        if: startsWith(github.ref, 'refs/heads/development/vrs-0.14.1')
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -B vrs_ui_gallery.py --output "${{ runner.temp }}/vrs-ui-gallery"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/heads/development/vrs-0.14.1') && always()
        with:
          name: vrs-ui-gallery-synthetic
          path: ${{ runner.temp }}/vrs-ui-gallery/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Build exact source-only RC1 candidate (no data or runtime assets)
        if: github.ref == 'refs/heads/development/vrs-0.14.1-rc1'
        run: |
          python -B vrs_build_portable.py
          sha256sum dist/VRS-0.14.1-rc.1-source.zip
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/development/vrs-0.14.1-rc1'
        with:
          name: vrs-rc1-source-candidate-unfrozen
          path: worker/dist/VRS-0.14.1-rc.1-source.zip
          if-no-files-found: error
          retention-days: 14
