name: VRS baseline CPU regression
on:
  push:
    branches: [development/gpu-worker-v0.1.0, development/vrs-0.13.0, development/vrs-0.13.1]
    paths:
      - 'worker/**'
      - '.github/workflows/vrs-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: worker
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: cd1455caa0de793a0b5cbffdb609098cd908482e
          path: immutable-baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install Pillow==12.3.0 PyMuPDF==1.26.7 numpy==2.3.5
          python -m pip install -r requirements-hardware.txt
          python -c "import tkinter, torch, psutil; print(torch.__version__, psutil.__version__)"
      - name: Verify pinned baseline
        run: python baseline_audit.py --root ../immutable-baseline/worker
      - name: Run immutable baseline regression (private fixtures intentionally absent)
        working-directory: immutable-baseline/worker
        run: xvfb-run -a python -m unittest discover -v
      - name: Run current regression tests (private fixtures intentionally absent)
        run: xvfb-run -a python -m unittest discover -v
