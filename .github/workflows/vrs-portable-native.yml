name: VRS portable Windows candidate
on:
  push:
    branches: [development/vrs-0.13.0, development/vrs-0.13.1, development/vrs-0.14.0, development/vrs-0.14.1, development/vrs-0.14.1-rc1]
    paths:
      - 'worker/**'
      - '.github/workflows/vrs-portable-native.yml'
      - '.github/scripts/vrs_validate_bom.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [review, cpu]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preserve Git blob line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/heads/development/vrs-0.14.')
        with:
          ref: 74eeab963a6451b63496ed8e29f7c0518b939980
          path: immutable-rc-base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Assemble and qualify disposable native package
        working-directory: worker
        run: |
          $extra = @()
          if (Test-Path "../immutable-rc-base/worker") { $extra = @("--compat-source", (Resolve-Path "../immutable-rc-base/worker").Path) }
          python -B vrs_native_acceptance.py --profile ${{ matrix.profile }} --disposable-test --report "${{ runner.temp }}/vrs-native-${{ matrix.profile }}.json" @extra
      - name: Validate exact candidate SBOM against pinned CycloneDX schema
        run: |
          python -m pip install jsonschema==4.25.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B .github/scripts/vrs_validate_bom.py "${{ runner.temp }}/vrs-native-${{ matrix.profile }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrs-native-${{ matrix.profile }}-evidence
          path: ${{ runner.temp }}/vrs-native-${{ matrix.profile }}*.json
          if-no-files-found: warn
          retention-days: 14
  auto-first-run:
    if: github.ref == 'refs/heads/development/vrs-0.14.1-rc1'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Preserve Git blob line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fresh standalone CPU setup without Python on PATH
        shell: powershell
        run: |
          $app = Join-Path "${{ runner.temp }}" "VRS auto owner trial"
          Copy-Item -LiteralPath worker -Destination $app -Recurse
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$app\Setup-Auto.ps1" -Profile cpu -AcceptDownloads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $app ".venv\cpu\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "Local interpreter absent" }
          & $py -E -s -B -c "import sys, pathlib, torch, tkinter; r=pathlib.Path(sys.argv[1]).resolve(); assert pathlib.Path(sys.prefix).resolve()==r/'.venv'/'cpu'; assert pathlib.Path(sys.base_prefix).resolve()==r/'runtime'/'cpu'; assert torch.version.cuda is None; print(torch.ones(4).sum().item()); print(tkinter.Tcl().eval('info patchlevel'))" $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$app\config\bootstrap-origin.json" "${{ runner.temp }}\vrs-auto-origin.json"
          Copy-Item "$app\config\portable.json" "${{ runner.temp }}\vrs-auto-installed.json"
          Remove-Item -LiteralPath $app -Recurse -Force
          if (Test-Path -LiteralPath $app) { throw "Local app not removable" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrs-auto-first-run-evidence
          path: ${{ runner.temp }}/vrs-auto-*.json
          if-no-files-found: warn
          retention-days: 14
