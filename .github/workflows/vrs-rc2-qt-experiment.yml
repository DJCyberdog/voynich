name: VRS RC2 Qt framework experiment
on:
  push:
    branches: [development/vrs-0.14.1-rc1]
    paths:
      - 'worker/experiments/rc2_ui_framework.py'
      - '.github/workflows/vrs-rc2-qt-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libxcb-cursor0 libxkbcommon-x11-0
      - name: Isolated experimental dependencies
        run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0 psutil==7.2.2 PySide6-Essentials==6.11.3 shiboken6==6.11.3
      - name: Compare on Linux display
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -B worker/experiments/rc2_ui_framework.py tk --output qt-results
          xvfb-run -a -s "-screen 0 1920x1080x24" python -B worker/experiments/rc2_ui_framework.py qt --output qt-results
      - name: Compare on Windows display
        if: runner.os == 'Windows'
        run: |
          python -B worker/experiments/rc2_ui_framework.py tk --output qt-results
          python -B worker/experiments/rc2_ui_framework.py qt --output qt-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-comparison-${{ matrix.os }}
          path: qt-results/
          if-no-files-found: warn
          retention-days: 14
