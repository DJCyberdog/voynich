name: VRS RC2 dependency advisory audit
on:
  push:
    branches: [development/vrs-0.14.1-rc1]
    paths:
      - 'worker/requirements-*.txt'
      - 'worker/vrs_portable.py'
      - 'worker/vrs_auto_setup.py'
      - 'worker/vrs_audit_projection.py'
      - 'worker/vrs_rc2_migration.py'
      - 'worker/test_vrs_security_migration.py'
      - 'worker/test_vrs_rc2_migration_fixture.py'
      - '.github/workflows/vrs-rc2-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [review, compute]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated advisory scanner
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1
      - name: Resolve and audit declared profile (not full native lock)
        working-directory: worker
        run: python -m pip_audit --strict --vulnerability-service pypi -r requirements-${{ matrix.profile }}.txt
  installed-cpu-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve separate actual CPU environment
        run: |
          python -m venv "${RUNNER_TEMP}/vrs-cpu-audit"
          "${RUNNER_TEMP}/vrs-cpu-audit/bin/python" -m pip install --only-binary=:all: -r worker/requirements-cpu.txt
          "${RUNNER_TEMP}/vrs-cpu-audit/bin/python" -m pip install --only-binary=:all: -r worker/requirements-compute.txt -r worker/requirements-tray.txt
          "${RUNNER_TEMP}/vrs-cpu-audit/bin/python" -m pip check
          "${RUNNER_TEMP}/vrs-cpu-audit/bin/python" -c "import torch,PIL; assert torch.__version__=='2.13.0+cpu' and PIL.__version__=='13.0.0'; assert torch.version.cuda is None; assert torch.ones(4).sum().item()==4"
      - name: Audit installed CPU packages including transitive dependencies
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1
          "${RUNNER_TEMP}/vrs-cpu-audit/bin/python" -I -B worker/vrs_audit_projection.py "${RUNNER_TEMP}/vrs-audit-requirements.txt" "${RUNNER_TEMP}/vrs-audit-inventory.json"
          python -m pip_audit --strict --no-deps --disable-pip --vulnerability-service pypi -r "${RUNNER_TEMP}/vrs-audit-requirements.txt"
  migration-candidate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Preserve Git blob line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8121427f4612eee3d95de58c685015de84bb3491
          path: immutable-rc1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact RC1 snapshot and private candidate preparation
        working-directory: worker
        env:
          VRS_RC1_SOURCE: ${{ github.workspace }}/immutable-rc1/worker
        run: python -B -m unittest -v test_vrs_security_migration test_vrs_rc2_migration_fixture
