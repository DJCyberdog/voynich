name: VRS RC2 dependency advisory audit
on:
  push:
    branches: [development/vrs-0.14.1-rc1]
    paths:
      - 'worker/requirements-*.txt'
      - 'worker/vrs_portable.py'
      - 'worker/vrs_auto_setup.py'
      - '.github/workflows/vrs-rc2-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [review, compute]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated advisory scanner
        run: python -m pip install --only-binary=:all: pip-audit==2.10.1
      - name: Resolve and audit declared profile (not full native lock)
        working-directory: worker
        run: python -m pip_audit --strict --vulnerability-service pypi -r requirements-${{ matrix.profile }}.txt
