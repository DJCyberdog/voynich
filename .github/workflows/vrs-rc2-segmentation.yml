name: VRS RC2 segmentation controls
on:
  push:
    branches: [development/vrs-0.14.1-rc1]
    paths:
      - 'worker/vrs_segmentation.py'
      - 'worker/vrs_service.py'
      - 'worker/vrs_coordinator.py'
      - 'worker/vrs_exceptions.py'
      - 'worker/test_vrs_segmentation.py'
      - 'worker/test_vrs_surface.py'
      - '.github/workflows/vrs-rc2-segmentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  segmentation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Preserve Git blob line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU geometry dependencies
        run: |
          python -m pip install Pillow==13.0.0 PyMuPDF==1.26.7 numpy==2.3.5 psutil
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
      - name: Run segmentation and resumable runtime surface controls
        working-directory: worker
        run: python -B -m unittest -v test_vrs_segmentation test_vrs_surface test_glyphs
